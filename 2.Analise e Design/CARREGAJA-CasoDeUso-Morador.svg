C07</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.1582" x="209.9861" y="627.046">Manter Ve&#237;culo</text></g><g id="elem_UC08"><ellipse cx="256.8944" cy="706.6883" fill="#F7F9F9" rx="130.8944" ry="28.5789" style="stroke:#264653;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.793" x="238.998" y="701.6121">UC08</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.5234" x="170.1327" y="719.2215">Consultar Consumo do M&#234;s</text></g><!--entity MOR--><g id="elem_MOR"><ellipse cx="33" cy="466.6094" fill="#F1F1F1" rx="16" ry="16" style="stroke:#181818;stroke-width:0.5;"/><path d="M33,486.6094 C37,486.6094 40,486.6094 44,482.6094 C52,482.6094 60,490.6094 60,498.6094 L60,502.6094 C60,506.6094 56,510.6094 52,510.6094 L14,510.6094 C10,510.6094 6,506.6094 6,502.6094 L6,498.6094 C6,490.6094 14,482.6094 22,482.6094 C26,486.6094 29,486.6094 33,486.6094 " fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.1309" x="6.9346" y="525.6426">Morador</text></g><g id="elem_GMN20"><path d="M135,44.6094 L135,169.0703 A0,0 0 0 0 135,169.0703 L253,169.0703 L257,220.5994 L261,169.0703 L379.2534,169.0703 A0,0 0 0 0 379.2534,169.0703 L379.2534,54.6094 L369.2534,44.6094 L135,44.6094 A0,0 0 0 0 135,44.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M369.2534,44.6094 L369.2534,54.6094 L379.2534,54.6094 L369.2534,44.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2534" x="141" y="63.1045">O ciclo do morador se resolve em uma</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.5933" x="141" y="79.4561">&#250;nica ida &#224;